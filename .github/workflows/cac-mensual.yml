name: Índice CAC · mensual

# CAMARCO publica el índice una vez por mes, entre el 20 y el 25.
# Se mira todos los días a las 10:00 de Argentina y el script avisa sólo cuando aparece un período nuevo.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: dolar-estado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node bin/cac.mjs
        env:
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NOMBRE: ${{ vars.MAIL_FROM_NOMBRE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_PLANTILLA: ${{ vars.WHATSAPP_PLANTILLA }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      - name: Guardar estado
        if: always()
        run: |
          git config user.name  "Ezequiel Orozco"
          git config user.email "22299179+ezequielo123@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "datos: CAC $(date -u +%F)"
          git pull --rebase --autostash && git push
